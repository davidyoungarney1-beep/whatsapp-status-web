<section id="shared-join-groups" style="max-width:900px;margin:22px auto;padding:18px;border:1px solid #d7e4df;border-radius:14px;background:#fff;color:#173d31">
<h2>Add WhatsApp Group / Join Groups</h2><p>Add invite links to the shared library. Groups added here and links published by Save Groups are shared with all users.</p>
<label for="sj-account"><b>WhatsApp account to use</b></label><select id="sj-account" style="width:100%;padding:10px;margin:6px 0 12px"></select>
<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="sj-link" type="url" placeholder="Paste WhatsApp group invite link" style="flex:1;min-width:220px;padding:11px"><input id="sj-name" maxlength="100" placeholder="Group name (optional)" style="flex:1;min-width:140px;padding:11px"><button id="sj-add" onclick="sjAdd()">Add WhatsApp Group</button></div>
<div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap"><button onclick="sjJoinAll()">Join All Groups</button><button id="sj-stop" onclick="sjStop()" disabled>Stop Joining Groups</button><button onclick="sjLoad()">Refresh Shared Groups</button><b id="sj-progress" role="status" aria-live="polite"></b></div><div id="sj-list">Loading shared groups...</div></section>
<script>
(function(){var api="https://whatsapp-status-web.onrender.com";function el(id){return document.getElementById(id)}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
window.sjAccounts=async function(){try{var r=await fetch(api+"/api/accounts"),d=await r.json(),s=el("sj-account");s.innerHTML=(d.accounts||[]).map(function(a){return "<option value=\""+esc(a.id)+"\">"+esc(a.phone||a.id)+(a.connected?" — Connected":" — Disconnected")+"</option>"}).join("");if(!s.options.length)s.innerHTML="<option value=\"\">No accounts</option>"}catch(e){el("sj-account").innerHTML="<option>Could not load accounts</option>"}};
window.sjAdd=async function(){var b=el("sj-add");b.disabled=true;try{var r=await fetch(api+"/api/join-groups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({link:el("sj-link").value,name:el("sj-name").value})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Could not add group");el("sj-link").value="";el("sj-name").value="";el("sj-progress").textContent=d.message;await sjLoad()}catch(e){el("sj-progress").textContent=e.message}finally{b.disabled=false}};
window.sjLoad=async function(){try{var r=await fetch(api+"/api/join-groups"),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Could not load groups");var gs=d.groups||[];el("sj-list").innerHTML="<div style=\"border:1px solid #e0e9e5;border-radius:8px;padding:14px;margin:7px 0\"><b>"+gs.length+"</b> shared group invite link"+(gs.length===1?"":"s")+" available</div>"}catch(e){el("sj-list").textContent=e.message}};
window.sjJoinOne=async function(code){var id=el("sj-account").value;if(!id){el("sj-progress").textContent="Connect a WhatsApp account first";return}try{var r=await fetch(api+"/api/accounts/"+encodeURIComponent(id)+"/join-groups/"+encodeURIComponent(code)+"/join",{method:"POST"}),d=await r.json();if(!r.ok||!d.success)throw Error(d.result&&d.result.message||d.error||"Join failed");el("sj-progress").textContent=d.result.message}catch(e){el("sj-progress").textContent=e.message}};
window.sjWatchAccount=async function(accountId){var s=el("sj-account");if(accountId)s.value=accountId;var id=accountId||s.value;if(!id)return;var tries=0;var stop=el("sj-stop");async function poll(){try{var r=await fetch(api+"/api/accounts/"+encodeURIComponent(id)+"/join-groups/progress"),d=await r.json(),j=d.progress||{};var accountName=s.options[s.selectedIndex]?.textContent||id; if(j.state==="idle"&&tries<60){el("sj-progress").textContent=accountName+": Saving groups and preparing shared invites...";tries++;if(stop)stop.disabled=true;setTimeout(poll,1000);return;}el("sj-progress").textContent=accountName+": "+(j.message||"Waiting for joining status...");if(stop)stop.disabled=j.state!=="running";if(j.state==="running")setTimeout(poll,1000);}catch(e){el("sj-progress").textContent=e.message;if(stop)stop.disabled=true;}}poll()};
window.sjStop=async function(){var id=el("sj-account").value,b=el("sj-stop");if(!id)return; b.disabled=true;b.textContent="Stopping...";try{var r=await fetch(api+"/api/accounts/"+encodeURIComponent(id)+"/join-groups/stop",{method:"POST"}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Could not stop joining");el("sj-progress").textContent=d.message||"Stop requested";window.sjWatchAccount(id);}catch(e){el("sj-progress").textContent=e.message;b.disabled=false;b.textContent="Stop Joining Groups"}};
window.sjJoinAll=async function(){var id=el("sj-account").value;if(!id){el("sj-progress").textContent="Connect a WhatsApp account first";return}try{var r=await fetch(api+"/api/accounts/"+encodeURIComponent(id)+"/join-groups/join-all",{method:"POST"}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||"Could not start");window.sjWatchAccount(id)}catch(e){el("sj-progress").textContent=e.message}};
document.addEventListener("DOMContentLoaded",function(){sjAccounts();sjLoad()});})();
</script>
